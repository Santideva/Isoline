<!-- index.html -->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Isoline — Procedural Shape Studio</title>

    <!-- Google Analytics (GA4) — basic usage analytics only.
         Loaded directly in <head> per Google's standard snippet so it
         tracks reliably regardless of how the JS bundle loads/errors. -->
    <script
      async
      src="https://www.googletagmanager.com/gtag/js?id=G-780ZWFVZST"
    ></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() {
        dataLayer.push(arguments);
      }
      gtag("js", new Date());
      gtag("config", "G-780ZWFVZST");
    </script>
    <style>
      /* ── Global reset — prevents all page-level scrollbars ── */
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html {
        width: 100%;
        height: 100%;
        overflow: hidden;
      }

      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
        /* Prevent browser from reserving scrollbar gutter space */
        scrollbar-width: none;
        -ms-overflow-style: none;
      }

      body::-webkit-scrollbar {
        display: none;
      }

      /* Viewport fills the full window exactly */
      #viewport {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }

      /* Three.js canvas must be block to avoid inline spacing */
      canvas {
        display: block;
      }

      /* ── Legacy panel — hidden by JS but kept for fallback ── */
      #schur-ui {
        position: absolute;
        top: 10px;
        right: 10px;
        background: rgba(255, 255, 255, 0.9);
        padding: 8px;
        border-radius: 4px;
        font-family: sans-serif;
        font-size: 14px;
        z-index: 1000;
        display: none;
      }
      #schur-ui select {
        width: 160px;
        height: 100px;
      }

      /* ── Node canvas overlay — must never cause page scroll ── */
      #node-canvas-overlay {
        position: fixed !important;
        top: 0 !important;
        left: 0 !important;
        right: 0 !important;
        bottom: 0 !important;
        width: 100% !important;
        height: 100% !important;
        overflow: hidden !important;
        max-width: 100vw !important;
        max-height: 100vh !important;
      }

      /* ── Toolbar scrollbar — thin, unobtrusive, webkit ── */
      #node-canvas-overlay > div:first-child::-webkit-scrollbar {
        height: 2px;
      }
      #node-canvas-overlay > div:first-child::-webkit-scrollbar-track {
        background: transparent;
      }
      #node-canvas-overlay > div:first-child::-webkit-scrollbar-thumb {
        background: rgba(255, 255, 255, 0.18);
        border-radius: 2px;
      }
    </style>
  </head>
  <body>
    <div id="viewport"></div>

    <!-- Schur base-shape selector -->
    <div id="schur-ui">
      <label for="base-shapes">Base Shapes (Ctrl+click):</label><br />
      <select id="base-shapes" multiple></select
      ><br />
      <button id="compose-btn">Compose Schur</button>
    </div>

    <script type="module" src="/dist/bundle.js"></script>
  </body>
</html>
